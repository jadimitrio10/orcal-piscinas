# Publica el sitio en CaribeHost (Plesk) por FTP cada vez que se sube un cambio.
# Necesita estos secretos en GitHub (Settings > Secrets and variables > Actions):
#   FTP_SERVER    servidor FTP de Plesk (por ejemplo 144.217.64.24)
#   FTP_USERNAME  usuario FTP de orcalpiscinas.com
#   FTP_PASSWORD  contraseña FTP
#   FTP_DIR       carpeta de destino, terminada en "/" (por ejemplo /orcal-web/)
# Mientras falten, el trabajo termina sin hacer nada.
name: Publicar en CaribeHost

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publicar-caribehost
  cancel-in-progress: false

jobs:
  ftp:
    runs-on: ubuntu-latest
    steps:
      - name: Revisar que existan los datos de FTP
        id: datos
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
        run: |
          if [ -n "$FTP_SERVER" ] && [ -n "$FTP_USERNAME" ] && [ -n "$FTP_PASSWORD" ] && [ -n "$FTP_DIR" ]; then
            echo "listo=true" >> "$GITHUB_OUTPUT"
          else
            echo "Faltan secretos de FTP; no se publica nada." >> "$GITHUB_STEP_SUMMARY"
            echo "listo=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.datos.outputs.listo == 'true'
        with:
          fetch-depth: 0

      # Las fechas de los archivos quedan como las del último cambio en git,
      # así solo se suben los archivos que de verdad cambiaron.
      - name: Preparar herramientas
        if: steps.datos.outputs.listo == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp git-restore-mtime
          git restore-mtime

      # lftp maneja bien FTPS (conexión cifrada) con el servidor de Plesk.
      - name: Subir archivos por FTP
        if: steps.datos.outputs.listo == 'true'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
        run: |
          export LFTP_PASSWORD="$FTP_PASSWORD"
          lftp --env-password -u "$FTP_USERNAME" "$FTP_SERVER" <<FIN
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate no
          set net:max-retries 3
          set net:timeout 30
          mirror --reverse --verbose --parallel=4 --no-perms \
            --exclude-glob .git* --exclude .git/ --exclude .github/ \
            --exclude-glob netlify.toml --exclude-glob README.md \
            ./ "$FTP_DIR"
          quit
          FIN

      # Pide algunas páginas y fotos directamente al servidor de CaribeHost
      # (sin pasar por el DNS) y compara el tamaño con el del repositorio.
      - name: Revisar el sitio en CaribeHost
        if: steps.datos.outputs.listo == 'true'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          echo "| Archivo | HTTP | Tipo | Bytes servidor | Bytes repo |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for f in index.html wp-content/uploads/2015/03/logoorcal.png wp-content/uploads/2015/05/DSC06642.jpg wp-content/themes/construction/style.css assets/orcal-galeria.css project/bdg-baru/index.html; do
            r=$(curl -sk -o /tmp/out --resolve "orcalpiscinas.com:443:$FTP_SERVER" -w '%{http_code} %{content_type}' "https://orcalpiscinas.com/${f/index.html/}" || echo "error -")
            echo "| $f | ${r%% *} | ${r#* } | $(stat -c %s /tmp/out 2>/dev/null) | $(stat -c %s "$f") |" | tee -a "$GITHUB_STEP_SUMMARY"
          done
          echo "Formulario (GET, se espera 405):" $(curl -sk -o /dev/null -w '%{http_code}' --resolve "orcalpiscinas.com:443:$FTP_SERVER" https://orcalpiscinas.com/contacto.php) | tee -a "$GITHUB_STEP_SUMMARY"
